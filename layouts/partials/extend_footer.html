<script>
  (function () {
    document.body.classList.add('reveal-ready');
    var items = document.querySelectorAll('.reveal');

    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px' });
      items.forEach(function (item) { observer.observe(item); });
    } else {
      items.forEach(function (item) { item.classList.add('is-visible'); });
    }

    try {
      if (document.documentElement.lang.toLowerCase().indexOf('de') === 0) {
        localStorage.setItem('preferred-language', 'de');
      }
      document.querySelectorAll('[data-language-option]').forEach(function (link) {
        link.addEventListener('click', function () {
          var language = link.getAttribute('data-language-option');
          if (language === 'en' || language === 'de') {
            localStorage.setItem('preferred-language', language);
          }
        });
      });
    } catch (_) {
      /* Language links continue to work when storage is unavailable. */
    }

  }());
</script>
