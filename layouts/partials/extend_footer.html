<script>
  (function () {
    document.body.classList.add('reveal-ready');
    var items = document.querySelectorAll('.reveal');

    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px' });
      items.forEach(function (item) { observer.observe(item); });
    } else {
      items.forEach(function (item) { item.classList.add('is-visible'); });
    }

    var system = document.querySelector('.hero-system');
    if (system && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      system.addEventListener('pointermove', function (event) {
        var rect = system.getBoundingClientRect();
        system.style.setProperty('--pointer-x', ((event.clientX - rect.left) / rect.width * 100) + '%');
        system.style.setProperty('--pointer-y', ((event.clientY - rect.top) / rect.height * 100) + '%');
      });
    }
  }());
</script>
