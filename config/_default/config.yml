enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']

params:
  author: "Akshat Gupta"
  defaultTheme: auto
  env: production
  social:
    twitter: akshat_rg
  schema:
    publisherType: Person
    sameAs:
      - "https://www.linkedin.com/in/akshat-rg/"
      - "https://github.com/akshat4112"
      - "https://twitter.com/akshat_rg"
      - "https://kaggle.com/akshat4112/"
  mainSections:
    - posts
  description: "Akshat Gupta is an applied AI engineer and researcher working across agentic AI, document intelligence, evaluation, NLP, speech, and trustworthy machine learning."
  images: ["/akshat_gupta.jpg"]

  profileMode:
    enabled: true
    title: "Akshat Gupta" # optional default will be site title
    subtitle: "Applied AI Engineer | Agentic AI & LLM Systems | Production AI"
    imageUrl: "/akshat_gupta.jpg" # optional
    imageTitle: "Akshat Gupta" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

