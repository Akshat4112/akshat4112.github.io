baseURL: "https://akshat4112.github.io/"
title: Akshat Gupta
#paginate: 5
theme: PaperMod
googleAnalytics: "G-8YC2E5MW2M"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - name: Work
      url: /#work
      weight: 5
    - name: Writing
      url: /posts/
      weight: 10
    - name: Research
      url: /publications/
      weight: 15
    - name: About
      url: /about/
      weight: 20
