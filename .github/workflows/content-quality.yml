name: Content quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.2'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify consent and article analytics
        run: node --test scripts/test_analytics.cjs

      - name: Validate article content
        run: python3 scripts/check_content.py

      - name: Build site
        run: hugo --minify

      - name: Verify rendered mathematics and reading time
        run: python3 scripts/check_math_rendering.py

      - name: Verify privacy language routes
        run: python3 scripts/check_privacy_routes.py

      - name: Verify Now language routes
        run: python3 scripts/check_now_routes.py

      - name: Verify project discovery and writing chronology
        run: python3 scripts/check_portfolio_refresh.py

      - name: Verify landing-page entry points
        run: python3 scripts/check_portfolio_presentation.py

      - name: Verify article navigation and accessibility
        run: python3 scripts/check_navigation_accessibility.py

      - name: Verify article analytics page markers
        run: python3 scripts/check_analytics_pages.py
